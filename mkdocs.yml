site_name: AI Training for Specialists and Executives
site_description: Training materials for specialists and executives in AI & Management.
site_url: https://EmanuelST-G.github.io/ai-training-starter/
repo_url: https://github.com/EmanuelST-G/ai-training-starter
docs_dir: docs
use_directory_urls: true
exclude_docs: |
  superpowers/

theme:
  name: material
  language: en
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  font:
    text: Roboto
    code: Roboto Mono

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/print.css

extra_javascript:
  - javascripts/language-redirect.js

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: AI Training for Specialists and Executives
          site_description: Training materials for specialists and executives in AI & Management.
          nav:
            - Home: en/index.md
            - Welcome: en/welcome.md
            - Learning Path: en/lernpfad.md
            - Topic List: en/themenliste.md
            - Phase 1 – Fundamentals:
                - AI Fundamentals: en/grundlagen/01-ai-grundlagen.md
                - LLMs: en/grundlagen/02-llms.md
                - Prompt Engineering: en/grundlagen/03-prompt-engineering.md
            - Phase 2 – Business:
                - Use Cases: en/business/04-use-cases.md
                - Evaluation: en/business/05-bewertung.md
                - Business Case: en/business/06-business-case.md
                - Data: en/business/07-daten.md
            - Phase 3 – Project Management:
                - Project Phases: en/projektleitung/08-projektphasen.md
                - Requirements: en/projektleitung/09-anforderungen.md
                - Evaluation & Quality: en/projektleitung/10-evaluation.md
                - Change Management: en/projektleitung/11-change.md
            - Phase 4 – Technology:
                - RAG and Enterprise Knowledge: en/technik/12-rag.md
                - AI Agents & Automation: en/technik/13-agents.md
                - Integrations & APIs: en/technik/14-integration.md
                - Productive Operations & LLMOps: en/technik/15-betrieb.md
            - Phase 5 – Responsibility:
