                - AI Security: en/verantwortung/17-security.md
                - Responsible AI: en/verantwortung/18-responsible-ai.md
                - AI Governance: en/verantwortung/19-governance.md
            - Glossary: en/glossar.md
            - Exercises:
                - Overview: en/uebungen/index.md
                - 1 – Reliable Project Status Prompt: en/uebungen/01-prompts-formulieren.md
                - 2 – Systematic Hallucination Detection: en/uebungen/02-halluzinationen-erkennen.md
                - 3 – Use-Case Prioritisation: en/uebungen/03-use-cases-priorisieren.md
                - 4 – Three-Scenario Business Case: en/uebungen/04-business-case-3-szenarien.md
                - 5 – Measurable Acceptance Criteria: en/uebungen/05-akzeptanzkriterien-formulieren.md
                - 6 – RAG Prototype Evaluation: en/uebungen/06-rag-prototyp-bewerten.md
                - 7 – Controlled Agent Process: en/uebungen/07-agentenprozess-skizzieren.md
                - 8 – Prompt Injection Demo: en/uebungen/08-prompt-injection-demo.md
                - 9 – Evaluation Rubric: en/uebungen/09-eval-raster-erstellen.md
                - 10 – AI Risk Register: en/uebungen/10-risikoregister-erstellen.md
                - 11 – PoC to Production Plan: en/uebungen/11-projektplan-von-poc-zu-betrieb.md
                - 12 – Change Communication: en/uebungen/12-change-kommunikation.md
                - 13 – DPIA Preparation: en/uebungen/13-datenschutz-folgenabschatzung.md
                - 14 – Responsible AI Guidelines: en/uebungen/14-leitlinien-responsible-ai.md
            - Cheat Sheets:
                - Overview: en/cheatsheets/index.md
                - Phase 1 – Fundamentals: en/cheatsheets/phase-1-grundlagen.md
                - Phase 2 – Business: en/cheatsheets/phase-2-business.md
                - Phase 3 – Project Management: en/cheatsheets/phase-3-projektleitung.md
                - Phase 4 – Technology: en/cheatsheets/phase-4-technik.md
                - Phase 5 – Responsibility: en/cheatsheets/phase-5-verantwortung.md
            - Case Studies:
